body:
  - type: markdown
    attributes:
      value: |
        Ideas and game requests are welcome. Supported games are listed on the [main page](https://github.com/moceure/BananaNative).
        **No game files, keys, firmware or links to them**: don't share them, offer them or ask where to get them. Banana Native works with your own dump of a game you own. Posts that break this are edited or removed ([rules](https://github.com/moceure/BananaNative/discussions/23)).
  - type: textarea
    id: body
    attributes:
      label: Your idea
      description: "What you'd like, and why. For a game request, its name and title ID (no files)."
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: My post has no game files, keys, firmware or links to them, and doesn't ask for any.
          required: true
