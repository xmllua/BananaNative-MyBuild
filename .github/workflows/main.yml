name: Build BananaNative APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        # 核心修复：加上 -PnxPackEngine=fake 骗过编译器的检查
        ./gradlew assembleDebug --stacktrace -PnxPackEngine=fake

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Debug-APK
        path: android/app/build/outputs/apk/debug/*.apk
