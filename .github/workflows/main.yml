name: Build BananaNative Full APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive # 确保拉取所有子模块代码

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Build On-Device Packer
      run: |
        cd android/ondevice
        # 修复由于 Windows 换行符导致的脚本无法执行问题
        sed -i 's/\r$//' build.sh
        chmod +x build.sh
        # 使用 bash 显式执行
        bash build.sh

    - name: Build with Gradle
      run: |
        cd android/app
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        chmod +x gradlew
        rm -rf ~/.gradle/caches
        
        # 关键：使用真正的 stage 路径打包，去掉 fake 参数
        ./gradlew assembleDebug --stacktrace -PnxPackStage=$(pwd)/../ondevice/stage

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BananaNative-Full-APK
        path: android/app/build/outputs/apk/debug/*.apk
